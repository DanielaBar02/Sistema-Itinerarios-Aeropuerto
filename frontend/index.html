<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Itinerarios · Colombia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --bg: #0a0e1a; --surface: #111827; --border: #1e2d45;
      --accent: #f59e0b; --accent2: #3b82f6; --text: #e2e8f0;
      --muted: #64748b; --success: #10b981; --danger: #ef4444;
      --radius: 10px; --mono: 'DM Mono', monospace; --sans: 'Syne', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }
    header { display: flex; align-items: center; gap: 1rem; padding: 1.4rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
    .logo span { color: var(--text); }
    nav { margin-left: auto; display: flex; gap: 0.25rem; }
    .tab-btn { font-family: var(--sans); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.5rem 1.1rem; border-radius: var(--radius); border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.18s; }
    .tab-btn:hover { color: var(--text); border-color: var(--border); }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .container { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .section-title { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }
    #map-container { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; height: 520px; background: #0d1526; }
    #map-loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-family: var(--mono); font-size: 0.85rem; gap: 0.6rem; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .airport-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.75rem; margin-top: 1.5rem; }
    .airport-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.1rem;
      transition: border-color 0.18s, transform 0.15s, box-shadow 0.18s;
      cursor: pointer;
    }
    .airport-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(245,158,11,0.15); }
    .airport-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245,158,11,0.3); }
    .airport-iata { font-family: var(--mono); font-size: 1.3rem; font-weight: 500; color: var(--accent); margin-bottom: 0.3rem; }
    .airport-name { font-weight: 600; font-size: 0.88rem; margin-bottom: 0.2rem; }
    .airport-meta { font-size: 0.78rem; color: var(--muted); font-family: var(--mono); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
    input { font-family: var(--mono); font-size: 0.88rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.55rem 0.75rem; outline: none; transition: border-color 0.18s; }
    input:focus { border-color: var(--accent2); }
    .btn { font-family: var(--sans); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.55rem 1.3rem; border-radius: 6px; border: none; cursor: pointer; transition: opacity 0.18s, transform 0.1s; }
    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .form-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    thead tr { border-bottom: 1px solid var(--border); }
    th { text-align: left; padding: 0.6rem 0.9rem; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    td { padding: 0.75rem 0.9rem; border-bottom: 1px solid #151f2e; font-family: var(--mono); font-size: 0.82rem; }
    tr:hover td { background: #0d1626; }
    .td-actions { display: flex; gap: 0.4rem; }
    #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.75rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-family: var(--mono); color: #fff; opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none; z-index: 999; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: var(--success); }
    #toast.error { background: var(--danger); }
    .empty { text-align: center; padding: 3rem; color: var(--muted); font-family: var(--mono); font-size: 0.85rem; }
    .map-hint { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); margin-bottom: 0.6rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">&#9992; itinera<span>col</span></div>
    <nav>
      <button class="tab-btn active" onclick="showTab('mapa', event)">Mapa</button>
      <button class="tab-btn" onclick="showTab('itinerarios', event)">Itinerarios</button>
    </nav>
  </header>

  <div id="tab-mapa" class="panel active container">
    <p class="section-title">Aeropuertos Colombianos</p>
    <p class="map-hint">Haz clic en una card para ubicar el aeropuerto en el mapa.</p>
    <div id="map-container">
      <div id="map-loading">
        <div class="spinner"></div>
        Cargando aeropuertos desde Airport Service...
      </div>
    </div>
    <div class="airport-grid" id="airport-list"></div>
  </div>

  <div id="tab-itinerarios" class="panel container">
    <p class="section-title">Nuevo Itinerario</p>
    <div class="card">
      <div class="form-grid">
        <div class="form-group full">
          <label>Nombre del usuario</label>
          <input id="f-user" type="text" placeholder="Ej: Juan Perez" />
        </div>
        <div class="form-group">
          <label>Aeropuerto de salida (ID)</label>
          <input id="f-dep" type="number" placeholder="Ej: 9" />
        </div>
        <div class="form-group">
          <label>Aeropuerto de llegada (ID)</label>
          <input id="f-arr" type="number" placeholder="Ej: 2" />
        </div>
        <div class="form-group">
          <label>Fecha de viaje</label>
          <input id="f-date" type="date" />
        </div>
        <div class="form-group">
          <label>Duracion (minutos)</label>
          <input id="f-dur" type="number" placeholder="Ej: 90" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="createItinerary()">Guardar itinerario</button>
        <button class="btn btn-ghost" onclick="clearForm()">Limpiar</button>
      </div>
    </div>
    <p class="section-title">Itinerarios Registrados</p>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Usuario</th><th>Salida</th><th>Llegada</th><th>Fecha</th><th>Duracion</th><th></th>
            </tr>
          </thead>
          <tbody id="itinerary-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    var AIRPORT_API   = "http://localhost:8000";
    var ITINERARY_API = "http://localhost:8001";
    var selectedCard  = null;

    function showTab(name, e) {
      document.querySelectorAll(".panel").forEach(function(p) { p.classList.remove("active"); });
      document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
      document.getElementById("tab-" + name).classList.add("active");
      e.target.classList.add("active");
      if (name === "itinerarios") loadItineraries();
    }

    function toast(msg, type) {
      type = type || "success";
      var el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "show " + type;
      setTimeout(function() { el.className = ""; }, 3500);
    }

    // Hace zoom en el mapa sobre un aeropuerto específico
    function flyToAirport(lat, lon, name, card) {
      // Quitar selección anterior
      if (selectedCard) selectedCard.classList.remove("selected");
      card.classList.add("selected");
      selectedCard = card;

      // Scroll al mapa
      document.getElementById("map-container").scrollIntoView({ behavior: "smooth", block: "start" });

      // Reanimar el mapa con zoom en ese punto
      Plotly.relayout("map-container", {
        "mapbox.center": { lat: lat, lon: lon },
        "mapbox.zoom": 9,
      });
    }

    // Vuelve al zoom general de Colombia
    function resetMap() {
      Plotly.relayout("map-container", {
        "mapbox.center": { lat: 4.5, lon: -74.0 },
        "mapbox.zoom": 4.8,
      });
      if (selectedCard) {
        selectedCard.classList.remove("selected");
        selectedCard = null;
      }
    }

    async function loadMap() {
      try {
        var res = await fetch(AIRPORT_API + "/airports/map");
        if (!res.ok) throw new Error("HTTP " + res.status);
        var airports = await res.json();

        document.getElementById("map-loading").style.display = "none";

        Plotly.newPlot("map-container", [{
          type: "scattermapbox",
          mode: "markers+text",
          lat: airports.map(function(a) { return a.lat; }),
          lon: airports.map(function(a) { return a.lon; }),
          text: airports.map(function(a) { return a.iata_code; }),
          hovertext: airports.map(function(a) { return a.text; }),
          hoverinfo: "text",
          textposition: "top center",
          textfont: { family: "DM Mono", size: 10, color: "#f59e0b" },
          marker: { size: 10, color: "#f59e0b", opacity: 0.95 },
        }], {
          mapbox: {
            style: "carto-darkmatter",
            center: { lat: 4.5, lon: -74.0 },
            zoom: 4.8,
          },
          paper_bgcolor: "transparent",
          plot_bgcolor: "transparent",
          margin: { t: 0, b: 0, l: 0, r: 0 },
        }, { responsive: true, displayModeBar: false });

        // Cards con click para volar al aeropuerto
        var list = document.getElementById("airport-list");
        list.innerHTML = airports.map(function(a, i) {
          return '<div class="airport-card" id="card-' + i + '" onclick="flyToAirport(' + a.lat + ',' + a.lon + ',\'' + a.name.replace(/'/g, '') + '\', document.getElementById(\'card-' + i + '\'))">' +
            '<div class="airport-iata">' + a.iata_code + '</div>' +
            '<div class="airport-name">' + a.name + '</div>' +
            '<div class="airport-meta">ID: ' + a.id + ' &middot; ' + a.city + ', ' + a.department + '</div>' +
            '</div>';
        }).join("");

        // Doble clic en el mapa para volver al zoom general
        document.getElementById("map-container").addEventListener("dblclick", resetMap);

      } catch (err) {
        document.getElementById("map-loading").innerHTML =
          '<span style="color:var(--danger)">Error: ' + err.message + '</span>';
      }
    }

    async function loadItineraries() {
      try {
        var res = await fetch(ITINERARY_API + "/itineraries/");
        var data = await res.json();
        var tbody = document.getElementById("itinerary-table");
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="7"><div class="empty">Sin itinerarios registrados.</div></td></tr>';
          return;
        }
        tbody.innerHTML = data.map(function(it) {
          return '<tr>' +
            '<td>#' + it.id + '</td>' +
            '<td>' + it.user_name + '</td>' +
            '<td>' + it.departure_airport_id + '</td>' +
            '<td>' + it.arrival_airport_id + '</td>' +
            '<td>' + it.travel_date + '</td>' +
            '<td>' + it.duration_minutes + ' min</td>' +
            '<td><div class="td-actions">' +
            '<button class="btn btn-danger" onclick="deleteItinerary(' + it.id + ')">x</button>' +
            '</div></td></tr>';
        }).join("");
      } catch (err) {
        toast("Error cargando itinerarios: " + err.message, "error");
      }
    }

    async function createItinerary() {
      var body = {
        user_name:            document.getElementById("f-user").value.trim(),
        departure_airport_id: parseInt(document.getElementById("f-dep").value),
        arrival_airport_id:   parseInt(document.getElementById("f-arr").value),
        travel_date:          document.getElementById("f-date").value,
        duration_minutes:     parseInt(document.getElementById("f-dur").value),
      };
      if (!body.user_name || !body.travel_date || isNaN(body.departure_airport_id)) {
        toast("Completa todos los campos.", "error");
        return;
      }
      try {
        var res = await fetch(ITINERARY_API + "/itineraries/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          var errData = await res.json();
          throw new Error(errData.detail || "HTTP " + res.status);
        }
        toast("Itinerario guardado correctamente.");
        clearForm();
        loadItineraries();
      } catch (err) {
        toast("Error: " + err.message, "error");
      }
    }

    async function deleteItinerary(id) {
      if (!confirm("Eliminar itinerario #" + id + "?")) return;
      try {
        var res = await fetch(ITINERARY_API + "/itineraries/" + id, { method: "DELETE" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        toast("Itinerario eliminado.");
        loadItineraries();
      } catch (err) {
        toast("Error: " + err.message, "error");
      }
    }

    function clearForm() {
      ["f-user", "f-dep", "f-arr", "f-date", "f-dur"].forEach(function(id) {
        document.getElementById(id).value = "";
      });
    }

    loadMap();
  </script>
</body>
</html>
